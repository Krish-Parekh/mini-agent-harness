name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: miniagent
          POSTGRES_PASSWORD: miniagent
          POSTGRES_DB: miniagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miniagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://miniagent:miniagent@localhost:5432/miniagent
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check backend miniagent tests
      - run: uv run pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint

  check:
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.backend.result }}" = success && test "${{ needs.frontend.result }}" = success
