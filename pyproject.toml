[project]
name = "mini-agent"
version = "0.1.0"
description = "A minimal OpenHands-style coding agent: event log, action/observation loop, pluggable tools and sandboxes."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.40",
]

[project.scripts]
mini-agent = "miniagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miniagent"]
