[project]
name = "mini-agent"
version = "0.1.0"
description = "A minimal OpenHands-style coding agent: event log, action/observation loop, pluggable tools and sandboxes."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.40",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "tenacity>=9.1.4",
    "pyjwt[crypto]>=2.10",
    "logfire[fastapi]>=4.39.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
docker = ["docker>=7.2"]
e2b = ["e2b>=2.21,<3"]
daytona = ["daytona>=0.220"]
modal = ["modal>=1.6.1"]
vercel = ["vercel-sandbox>=0.7"]

[project.scripts]
mini-agent = "miniagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miniagent"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.15.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "alembic>=1.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["remote: runs against a hosted sandbox provider and needs its credentials"]

[tool.logfire]
ignore_no_config = true
