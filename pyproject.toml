[project]
name = "mini-agent"
version = "0.1.0"
description = "A minimal OpenHands-style coding agent: event log, action/observation loop, pluggable tools and sandboxes."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.40",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
mini-agent = "miniagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miniagent"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.15.15",
]
